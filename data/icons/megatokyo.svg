<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Megatokyo</title>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#3C4344"/>

  <!-- "mt" monogram, re-vectored from the official megatokyo.com favicon
       (dark slate background, amber "m", white "t"), scaled and centered. -->
  <g transform="translate(64, 124)">

    <!-- m: three legs, a shared rounded cap, and two notches carved into
         the cap to separate it into arches — matches the source favicon,
         where the arches merge into one solid band near the very top. -->
    <g fill="#FFBF00">
      <path d="M 0,88 H 50 V 242 A 22,22 0 0 1 28,264 H 22 A 22,22 0 0 1 0,242 Z"/>
      <path d="M 97,88 H 147 V 242 A 22,22 0 0 1 125,264 H 119 A 22,22 0 0 1 97,242 Z"/>
      <path d="M 194,88 H 244 V 242 A 22,22 0 0 1 222,264 H 216 A 22,22 0 0 1 194,242 Z"/>
      <path d="M 0,100 V 72 A 28,28 0 0 1 28,44 H 216 A 28,28 0 0 1 244,72 V 100 Z"/>
    </g>
    <g fill="#3C4344">
      <path d="M 50,100 V 81.5 A 23.5,23.5 0 0 1 97,81.5 V 100 Z"/>
      <path d="M 147,100 V 81.5 A 23.5,23.5 0 0 1 194,81.5 V 100 Z"/>
    </g>

    <!-- t: stem + crossbar -->
    <g fill="#FFFFFF">
      <path d="M 296,22 A 22,22 0 0 1 318,0 H 324 A 22,22 0 0 1 346,22 V 242 A 22,22 0 0 1 324,264 H 318 A 22,22 0 0 1 296,242 Z"/>
      <path d="M 258,82 A 22,22 0 0 1 280,60 H 362 A 22,22 0 0 1 384,82 V 88 A 22,22 0 0 1 362,110 H 280 A 22,22 0 0 1 258,88 Z"/>
    </g>
  </g>
</svg>
