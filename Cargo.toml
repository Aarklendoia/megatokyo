[workspace]
resolver = "2"
members = ["core", "daemon", "gui"]

[workspace.package]
version = "0.5.1"
edition = "2021"
authors = ["Édouard Biton"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Aarklendoia/megatokyo-rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.ci]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
